# M3 session 4: Claude Sonnet 5.5 at effort medium on all 65 development consultations
# (330 notes), Pass A only, strict standard. Same as claude-medium.toml but for the cap.
# Key: ANTHROPIC_API_KEY in the environment (never in this file).
mode = "full"
standard = "strict"
passes = ["a"]

[model]
provider = "anthropic"
name = "claude-sonnet-5-5"
effort = "medium"
max_tokens = 16000
cache_ttl = "5m"        # live calls on one consultation follow each other within minutes

[model.prices]
# USD per million tokens for Claude Sonnet 5.5 (input, output, 5-minute and 1-hour cache
# writes, cache reads). Confirm on the Anthropic pricing page before the run.
input = 2.0
output = 10.0
cache_write_5m = 2.5
cache_write_1h = 4.0
cache_read = 0.2
batch_multiplier = 0.5

[budget]
cost_cap_usd = 25.0     # about $14 expected at v3's $0.042 per note

[pass_a]
pipeline = "scribecheck"

[report]
pass_a_trace = true    # each fact's path through Pass A, for the miss analysis
