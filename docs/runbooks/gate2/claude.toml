# Gate 2, Claude arm: the frozen system (tag m4-candidate-v4, prompt set scribecheck_v4).
# The same settings as the v4 full development run (docs/runbooks/m3s4/claude-medium-full.toml):
# Claude Sonnet 5.5 at effort medium, live calls, Pass A only, strict standard, with the
# Pass A trace the fact judge reads. Only the cap differs: $12 per run.
# Key: ANTHROPIC_API_KEY in the environment (never in this file).
mode = "full"
standard = "strict"
passes = ["a"]

[model]
provider = "anthropic"
name = "claude-sonnet-5-5"
effort = "medium"
max_tokens = 16000
cache_ttl = "5m"        # live calls on one consultation follow each other within minutes

[model.prices]
# USD per million tokens for Claude Sonnet 5.5 (input, output, 5-minute and 1-hour cache
# writes, cache reads). Confirm on the Anthropic pricing page before the run.
input = 2.0
output = 10.0
cache_write_5m = 2.5
cache_write_1h = 4.0
cache_read = 0.2
batch_multiplier = 0.5

[budget]
cost_cap_usd = 12.0     # about $7.40 expected for 198 notes at v4's $0.0375 per note

[pass_a]
pipeline = "scribecheck"

[report]
pass_a_trace = true    # each fact's path through Pass A, for the fact judge
